[project]
name = "tokenbench"
version = "1.0.0"
description = "TokenBench: an agentic coding benchmark harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
tokenbench = "tokenbench.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokenbench*"]

[tool.setuptools.package-data]
"tokenbench.ui" = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
